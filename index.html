<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phòng trống BK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch {}</script>
<style>
/* Hallmark · genre: modern-minimal · macrostructure: Catalogue · theme: Cobalt · enrichment: none · nav: N9 edge-aligned · footer: Ft2 inline
 * tone: utilitarian · anchor hue: 256 (cobalt) · audience: sinh viên BK tìm phòng tự học
 */
:root {
  --color-paper:    oklch(98.5% 0.004 250);
  --color-paper-2:  oklch(95.5% 0.006 252);
  --color-rule:     oklch(89% 0.008 255);
  --color-rule-2:   oklch(80% 0.010 256);
  --color-neutral:  oklch(52% 0.014 257);
  --color-ink-2:    oklch(34% 0.018 257);
  --color-ink:      oklch(24% 0.020 258);
  --color-accent:   oklch(52% 0.20 256);
  --color-accent-soft: oklch(95% 0.03 256);
  --color-accent-ink:  oklch(98.5% 0.004 250);
  --color-focus:    oklch(52% 0.20 256);
  --color-busy-bg:  oklch(95.5% 0.006 252);
  --color-scrim:    oklch(24% 0.02 258 / 0.35);
  color-scheme: light;

  --font-display: "Space Grotesk", system-ui, sans-serif;
  --font-body:    "Inter", system-ui, sans-serif;
  --font-mono:    "JetBrains Mono", ui-monospace, monospace;

  --text-xs: 0.75rem; --text-sm: 0.875rem; --text-md: 1rem; --text-lg: 1.25rem;
  --text-display: clamp(2.25rem, 6vw + 0.5rem, 4.5rem);

  --space-2xs: 4px; --space-xs: 8px; --space-sm: 12px; --space-md: 16px;
  --space-lg: 24px; --space-xl: 40px; --space-2xl: 64px;

  --radius-sm: 6px; --radius-md: 10px;
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --dur-fast: 120ms;
}

/* Dark: theo hệ thống, nút trên nav ghi đè bằng data-theme */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --color-paper:    oklch(17% 0.012 258);
    --color-paper-2:  oklch(21% 0.014 258);
    --color-busy-bg:  oklch(14.5% 0.010 258);
    --color-rule:     oklch(28% 0.014 258);
    --color-rule-2:   oklch(38% 0.016 258);
    --color-neutral:  oklch(68% 0.014 257);
    --color-ink-2:    oklch(84% 0.010 255);
    --color-ink:      oklch(95% 0.006 250);
    --color-accent:   oklch(72% 0.15 256);
    --color-accent-soft: oklch(26% 0.06 256);
    --color-accent-ink:  oklch(17% 0.012 258);
    --color-focus:    oklch(74% 0.15 256);
    --color-scrim:    oklch(8% 0.01 258 / 0.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --color-paper:    oklch(17% 0.012 258);
  --color-paper-2:  oklch(21% 0.014 258);
  --color-busy-bg:  oklch(14.5% 0.010 258);
  --color-rule:     oklch(28% 0.014 258);
  --color-rule-2:   oklch(38% 0.016 258);
  --color-neutral:  oklch(68% 0.014 257);
  --color-ink-2:    oklch(84% 0.010 255);
  --color-ink:      oklch(95% 0.006 250);
  --color-accent:   oklch(72% 0.15 256);
  --color-accent-soft: oklch(26% 0.06 256);
  --color-accent-ink:  oklch(17% 0.012 258);
  --color-focus:    oklch(74% 0.15 256);
  --color-scrim:    oklch(8% 0.01 258 / 0.6);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { overflow-x: clip; }
body {
  margin: 0; background: var(--color-paper); color: var(--color-ink-2);
  font: 400 var(--text-md)/1.5 var(--font-body);
  font-variant-numeric: tabular-nums;
}
.wrap { max-width: 1200px; margin: 0 auto; padding: 0 var(--space-md); }

/* Nav — edge-aligned, hairline below */
.nav { border-bottom: 1px solid var(--color-rule); }
.nav .wrap { display: flex; justify-content: space-between; align-items: center; min-height: 56px; gap: var(--space-md); }
.mark { font: 600 var(--text-md)/1 var(--font-display); color: var(--color-ink); letter-spacing: -0.01em; white-space: nowrap; }
.mark span { color: var(--color-accent); }
.nav-right { display: flex; align-items: center; gap: var(--space-sm); }
.nav-right .btn { height: 32px; }
#clock { display: none; }
@media (min-width: 560px) { #clock { display: block; } }
.meta { font: 500 var(--text-xs)/1 var(--font-mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--color-neutral); white-space: nowrap; }

/* Summary */
.summary { padding: var(--space-xl) 0 var(--space-lg); }
.summary h1 {
  margin: 0; font: 600 var(--text-display)/1 var(--font-display); color: var(--color-ink);
  letter-spacing: -0.035em; overflow-wrap: anywhere; min-width: 0;
}
.summary h1 b { color: var(--color-accent); font-weight: 600; }
.summary p { margin: var(--space-sm) 0 0; color: var(--color-neutral); }

/* Controls */
.controls { display: flex; flex-wrap: wrap; gap: var(--space-xs); padding-bottom: var(--space-lg); border-bottom: 1px solid var(--color-rule); }
.field { display: flex; flex-direction: column; gap: var(--space-2xs); min-width: 0; flex: 1 1 160px; }
.field label { font: 500 var(--text-xs)/1 var(--font-mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--color-neutral); }
input, select, .btn {
  font: 500 var(--text-sm)/1 var(--font-body); color: var(--color-ink);
  height: 40px; padding: 0 var(--space-sm); border: 1px solid var(--color-rule-2);
  border-radius: var(--radius-sm); background: var(--color-paper); min-width: 0; width: 100%;
  transition: border-color var(--dur-fast) var(--ease-out);
}
input:hover, select:hover, .btn:hover { border-color: var(--color-neutral); }
input:focus-visible, select:focus-visible, .btn:focus-visible, .seg input:focus-visible + span {
  outline: 2px solid var(--color-focus); outline-offset: 2px;
}
.btn { width: auto; cursor: pointer; white-space: nowrap; align-self: flex-end; }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: 0.45; cursor: default; transform: none; border-color: var(--color-rule-2); }

.seg { display: flex; border: 1px solid var(--color-rule-2); border-radius: var(--radius-sm); overflow: hidden; height: 40px; flex: 1 1 240px; align-self: flex-end; }
.seg label { flex: 1; display: flex; position: relative; }
.seg input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.seg span {
  flex: 1; display: grid; place-items: center; padding: 0 var(--space-sm); cursor: pointer; white-space: nowrap;
  font: 500 var(--text-sm)/1 var(--font-body); color: var(--color-ink-2);
  transition: background-color var(--dur-fast) var(--ease-out);
}
.seg label + label span { border-left: 1px solid var(--color-rule-2); }
.seg span:hover { background: var(--color-paper-2); }
.seg input:checked + span { background: var(--color-ink); color: var(--color-paper); }

/* Catalogue — one band per building */
.building { padding: var(--space-lg) 0; border-bottom: 1px solid var(--color-rule); }
.building h2 { display: flex; align-items: baseline; gap: var(--space-sm); margin: 0 0 var(--space-md); font: 600 var(--text-lg)/1.2 var(--font-display); color: var(--color-ink); letter-spacing: -0.01em; }
.building h2 small { font: 500 var(--text-xs)/1 var(--font-mono); letter-spacing: 0.06em; color: var(--color-neutral); text-transform: uppercase; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 168px), 1fr)); gap: var(--space-xs); }

.room {
  display: block; width: 100%; text-align: left; font: inherit; cursor: pointer;
  border: 1px solid var(--color-rule); border-radius: var(--radius-md); padding: var(--space-sm); min-width: 0;
  background: var(--color-busy-bg); transition: border-color var(--dur-fast) var(--ease-out);
}
.room.free { background: var(--color-paper); border-color: var(--color-rule-2); }
.room:hover { border-color: var(--color-neutral); }
.room:active { transform: translateY(1px); }
.room:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }
.room > span { display: block; }
.room .name { margin: 0; font: 500 var(--text-lg)/1.2 var(--font-mono); color: var(--color-ink); }
.room .st { margin-top: var(--space-2xs); font: 500 var(--text-xs)/1.3 var(--font-mono); letter-spacing: 0.04em; text-transform: uppercase; color: var(--color-neutral); }
.room.free .st { color: var(--color-accent); }
.room .st::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; background: currentColor; }
.room.busy .st::before { background: transparent; box-shadow: inset 0 0 0 1.5px currentColor; }
.room .cls { margin-top: var(--space-2xs); font-size: var(--text-sm); color: var(--color-ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Lịch cả ngày của 1 phòng */
dialog {
  width: min(480px, calc(100% - 2 * var(--space-md))); max-height: calc(100dvh - 2 * var(--space-xl));
  padding: 0; border: 1px solid var(--color-rule-2); border-radius: var(--radius-md);
  background: var(--color-paper); color: var(--color-ink-2);
}
dialog::backdrop { background: var(--color-scrim); }
.dlg-head { display: flex; justify-content: space-between; align-items: center; gap: var(--space-md); padding: var(--space-md); border-bottom: 1px solid var(--color-rule); }
.dlg-head h2 { margin: 0; font: 500 var(--text-lg)/1.2 var(--font-mono); color: var(--color-ink); overflow-wrap: anywhere; min-width: 0; }
.dlg-head .meta { margin-top: var(--space-2xs); }
.dlg-head .btn { align-self: center; }
.day { list-style: none; margin: 0; padding: 0; }
.day li { display: grid; grid-template-columns: 7.5em minmax(0, 1fr); gap: var(--space-sm); padding: var(--space-sm) var(--space-md); border-bottom: 1px solid var(--color-rule); }
.day li:last-child { border-bottom: 0; }
.day time { font: 500 var(--text-sm)/1.4 var(--font-mono); color: var(--color-ink); }
.day .c { font-size: var(--text-sm); }
.day .c small { display: block; font: 500 var(--text-xs)/1.4 var(--font-mono); letter-spacing: 0.04em; text-transform: uppercase; color: var(--color-neutral); }
.day li.now { background: var(--color-accent-soft); }
.day li.now small { color: var(--color-accent); }
.day li.past { opacity: 0.55; }
.day .none { display: block; color: var(--color-neutral); }
.report { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--space-sm); padding: var(--space-md); border-top: 1px solid var(--color-rule); font-size: var(--text-sm); color: var(--color-neutral); }
a.btn { display: inline-flex; align-items: center; text-decoration: none; }

.empty { padding: var(--space-2xl) 0; color: var(--color-neutral); }

footer { padding: var(--space-lg) 0 var(--space-xl); font-size: var(--text-sm); color: var(--color-neutral); }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header class="nav"><div class="wrap">
  <div class="mark">Phòng trống<span>.</span></div>
  <div class="nav-right">
    <div class="meta" id="clock"></div>
    <button type="button" class="btn" id="theme"></button>
  </div>
</div></header>

<main class="wrap">
  <section class="summary">
    <h1 id="headline">Đang tải…</h1>
    <p id="sub"></p>
  </section>

  <form class="controls" id="controls" onsubmit="return false">
    <div class="field"><label for="at">Xem lúc</label><input type="datetime-local" id="at"></div>
    <button type="button" class="btn" id="now">Về hiện tại</button>
    <div class="field"><label for="bld">Tòa nhà</label><select id="bld"><option value="">Tất cả tòa</option></select></div>
    <div class="field"><label for="q">Tìm phòng</label><input type="search" id="q" placeholder="VD: D9-5" autocomplete="off"></div>
    <div class="seg" role="radiogroup" aria-label="Lọc trạng thái">
      <label><input type="radio" name="st" value="free" checked><span>Trống</span></label>
      <label><input type="radio" name="st" value="busy"><span>Đang học</span></label>
      <label><input type="radio" name="st" value="all"><span>Tất cả</span></label>
    </div>
  </form>

  <div id="list"></div>
</main>

<footer class="wrap" id="foot"></footer>

<dialog id="dlg" aria-labelledby="dlg-title">
  <div class="dlg-head">
    <div><h2 id="dlg-title"></h2><div class="meta" id="dlg-meta"></div></div>
    <button type="button" class="btn" id="dlg-close">Đóng</button>
  </div>
  <ul class="day" id="dlg-list"></ul>
  <div class="report">
    <span id="report-q"></span>
    <a class="btn" id="report" target="_blank" rel="noopener">Báo sai</a>
  </div>
</dialog>

<script src="data.js"></script>
<script>
const WEEK1 = new Date(2026, 8, 7);            // Thứ Hai tuần 1, kỳ 20261
const SOURCE = 'TKB 20261 · cập nhật 11.09.2026';
const ISSUES = 'https://github.com/ledangquangdangquang/wswg/issues/new';  // nút "Báo sai" mở issue điền sẵn
const DAY = 864e5;

const { rooms, sessions } = window.TKB;
const building = r => r.slice(0, r.lastIndexOf('-'));
const hm = m => String(m / 60 | 0).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
const byRoom = rooms.map(() => []);
for (const s of sessions) byRoom[s[0]].push(s);
const order = rooms.map((_, i) => i).sort((a, b) => rooms[a].localeCompare(rooms[b], 'vi', { numeric: true }));

const $ = id => document.getElementById(id);
const bldSel = $('bld');
[...new Set(order.map(i => building(rooms[i])))].forEach(b => bldSel.add(new Option('Tòa ' + b, b)));

let live = true, ctx;
const esc = s => s.replace(/[&<>"]/g, c => `&#${c.charCodeAt(0)};`);
const toLocalInput = d => new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 16);

function weekOf(d) {
  const day = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  return Math.floor(Math.round((day - WEEK1) / DAY) / 7) + 1;
}

// Trạng thái 1 phòng tại (thứ, tuần, phút): {busy, cls, until}
function status(i, thu, week, t) {
  let cur = null, next = Infinity;
  for (const s of byRoom[i]) {
    if (s[1] !== thu || week < 1 || week > 30 || !(s[4] & (1 << week))) continue;
    if (s[2] <= t && t < s[3]) cur = cur && cur[3] > s[3] ? cur : s;
    else if (s[2] > t && s[2] < next) next = s[2];
  }
  return cur ? { busy: true, cls: cur, until: cur[3] } : { busy: false, until: next };
}

function render() {
  const d = live ? new Date() : new Date($('at').value || Date.now());
  if (live) $('at').value = toLocalInput(d);
  $('now').disabled = live;
  const js = d.getDay(), thu = js === 0 ? 8 : js + 1, week = weekOf(d), t = d.getHours() * 60 + d.getMinutes();
  const dayName = thu === 8 ? 'Chủ nhật' : 'Thứ ' + thu;
  ctx = { thu, week, t, dayName, date: d.toLocaleDateString('vi-VN') };
  const bld = bldSel.value, q = $('q').value.trim().toUpperCase(), mode = document.querySelector('[name=st]:checked').value;

  const groups = new Map();
  let free = 0, total = 0;
  for (const i of order) {
    const r = rooms[i];
    if (bld && building(r) !== bld) continue;
    if (q && !r.includes(q)) continue;
    const st = status(i, thu, week, t);
    total++; if (!st.busy) free++;
    if (mode === 'free' && st.busy || mode === 'busy' && !st.busy) continue;
    const b = building(r);
    if (!groups.has(b)) groups.set(b, []);
    groups.get(b).push([i, st]);
  }

  $('clock').textContent = `${dayName} · ${d.toLocaleDateString('vi-VN')} · ${hm(t)}`;
  $('headline').innerHTML = `<b>${free}</b> / ${total} phòng trống`;
  $('sub').textContent = `${dayName}, ${hm(t)} · ${week >= 1 ? 'tuần ' + week : 'chưa vào kỳ'}${live ? ' · tự cập nhật mỗi phút' : ''}`;

  $('list').innerHTML = groups.size ? [...groups].map(([b, list]) => `
    <section class="building">
      <h2>Tòa ${esc(b)} <small>${list.filter(x => !x[1].busy).length}/${list.length} trống</small></h2>
      <div class="grid">${list.map(([i, st]) => st.busy ? `
        <button type="button" class="room busy" data-i="${i}"><span class="name">${esc(rooms[i])}</span>
          <span class="st">Đang học · đến ${hm(st.until)}</span>
          <span class="cls" title="${esc(st.cls[5] + ' ' + st.cls[6])}">${esc(st.cls[5])} · ${esc(st.cls[6])}</span></button>` : `
        <button type="button" class="room free" data-i="${i}"><span class="name">${esc(rooms[i])}</span>
          <span class="st">Trống · ${st.until === Infinity ? 'hết ngày' : 'đến ' + hm(st.until)}</span></button>`).join('')}
      </div>
    </section>`).join('') : '<p class="empty">Không có phòng nào khớp bộ lọc.</p>';
}

// Lịch cả ngày (cùng thứ + tuần đang xem) của 1 phòng
function openDay(i) {
  const { thu, week, t, dayName, date } = ctx;
  const day = byRoom[i]
    .filter(s => s[1] === thu && week >= 1 && week <= 30 && s[4] & (1 << week))
    .sort((a, b) => a[2] - b[2] || a[3] - b[3]);
  $('dlg-title').textContent = rooms[i];
  $('dlg-meta').textContent = `${dayName} · ${date} · ${week >= 1 ? 'tuần ' + week : 'chưa vào kỳ'}`;
  $('dlg-list').innerHTML = day.length ? day.map(s => `
    <li class="${s[2] <= t && t < s[3] ? 'now' : s[3] <= t ? 'past' : ''}">
      <time>${hm(s[2])}–${hm(s[3])}</time>
      <div class="c">${esc(s[6])}<small>${esc(s[5])} · ${esc(s[7])} · lớp ${esc(s[8])}${s[2] <= t && t < s[3] ? ' · đang học' : ''}</small></div>
    </li>`).join('') : '<li><span class="none">Không có lớp nào trong ngày này.</span></li>';
  // Báo sai: app chỉ có thể sai theo 1 chiều tại giờ đang xem
  const st = status(i, thu, week, t), when = `${dayName} ${date} ${hm(t)} (tuần ${week})`;
  const claim = st.busy ? `Đang học ${st.cls[5]} (lớp ${st.cls[8]}) đến ${hm(st.until)}` : 'Trống';
  $('report-q').textContent = st.busy ? 'Thực tế phòng không có lớp?' : 'Thực tế phòng đang có người?';
  $('report').href = ISSUES + '?' + new URLSearchParams({
    title: `[Báo sai] ${rooms[i]} · ${when}`,
    body: `Phòng: ${rooms[i]}\nThời điểm: ${when}${live ? '' : ' (chọn giờ tay)'}\nApp báo: ${claim}\nThực tế: ${st.busy ? 'không có lớp' : 'có người đang dùng'}\n\nGhi chú (tuỳ chọn): \n\n---\n${SOURCE}`,
  });
  $('dlg').showModal();
}
$('list').addEventListener('click', e => { const b = e.target.closest('.room'); if (b) openDay(+b.dataset.i); });
$('dlg-close').addEventListener('click', () => $('dlg').close());
$('dlg').addEventListener('click', e => { if (e.target === $('dlg')) $('dlg').close(); });  // bấm ra ngoài để đóng

// Sáng / tối
const root = document.documentElement, sysDark = matchMedia('(prefers-color-scheme: dark)');
const isDark = () => root.dataset.theme ? root.dataset.theme === 'dark' : sysDark.matches;
const themeLabel = () => {
  $('theme').textContent = isDark() ? 'Sáng' : 'Tối';
  $('theme').setAttribute('aria-label', isDark() ? 'Chuyển sang giao diện sáng' : 'Chuyển sang giao diện tối');
};
$('theme').addEventListener('click', () => {
  root.dataset.theme = isDark() ? 'light' : 'dark';
  try { localStorage.setItem('theme', root.dataset.theme); } catch {}
  themeLabel();
});
sysDark.addEventListener('change', themeLabel);
themeLabel();

$('foot').textContent = `${SOURCE} · ${rooms.length} phòng học · tuần 1 bắt đầu ${WEEK1.toLocaleDateString('vi-VN')}`;
$('at').addEventListener('input', () => { live = false; render(); });
$('now').addEventListener('click', () => { live = true; render(); });
$('controls').addEventListener('input', e => { if (e.target.id !== 'at') render(); });
setInterval(() => live && render(), 60e3);
render();
</script>
</body>
</html>
